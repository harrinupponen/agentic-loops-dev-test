  # search input here, so until F-023 ships nothing in the browser can search.
  # `migration` REMOVED by this plan, and that is the line to reject on: the
  # design adds no column, no index and no migration at all. The text match is an
  # in-query tsvector expression over the existing todos_user_id_created_at_idx,
  # because every search is already scoped to one account and the GIN index that
  # would be the textbook answer is blocked by issue #11 (as it was for F-010).
  # ADR 0023 carries the exact index statement and the metric threshold that
  # would justify adding it later, with no application change. The other decision
  # worth reading is ADR 0022: search is a FILTER, not a ranking — results are
  # ordered created_at DESC and page through the existing keyset cursor, because
  # ts_rank is not a value a keyset cursor can be built from and OFFSET is
  # forbidden (ADR 0002). F-010's open question is answered: `q` composes with
  # the existing `deleted` parameter, so the trash is searchable exactly when the
  # caller asks for it, and never otherwise. Search responses deliberately bypass
  # F-012's cache in both directions.
  - id: F-013
    title: Full-text search over todo titles
    spec: specs/features/F-013-search.md
    status: done
    deps: [F-003]
    risk_tags: [performance]

  # Split during planning: the API is F-014, the browser screen is F-024 at the
  # bottom of this file — the same cut F-004/F-017, F-009/F-020, F-010/F-021 and
  # F-013/F-023 made. Nothing in the browser can see the trail until F-024 ships.
  # One additive migration: a new `audit_events` table with a composite primary
  # key `(user_id, created_at, id)` that IS the index for both query paths, so
  # there is no CREATE INDEX (issue #11 again — and note it is marked closed while
  # the conflict is still in the code) and NO contract step, ever. The event set
  # is closed at seven actions on the credential and session lifecycle; todo
  # operations and email verification are excluded on purpose (ADR 0011). The two
  # decisions worth reading are ADR 0024 (an audit write is awaited but never
  # fatal, never inside the transaction it describes, and nothing in the
  # application reads the log to decide anything — so the trail can have holes,
  # and audit_write_failures_total is the only counter here whose correct value is
  # zero) and ADR 0025 (four columns, no `details jsonb`, no IP, no user agent, no
  # email, 90 days). The line to reject on is the failed-sign-in asymmetry: an
  # attempt against a KNOWN address writes a row and one against an unknown
  # address writes nothing, which adds an INSERT to the one branch login works
  # hard to keep timing-indistinguishable. Bodies and status codes stay identical;
  # the argument for why timing does not leak is in the spec.
  - id: F-014
    title: Audit log for security-relevant events
    spec: specs/features/F-014-audit-log.md
    status: done
    deps: [F-009]
    risk_tags: [security, pii, migration]

  # Split during planning: this entry was "account deletion AND data export",
  # which is two independent server features with two different irreversible
  # edges. F-015 keeps the EXPORT; deletion is F-025 at the bottom of this file,
  # deps: [F-015]. Export ships first on purpose and that ordering is the line to
  # reject on: shipping erasure before a user can retrieve anything means a user
  # who deletes on day one and then asks for their data gets nothing, forever,
  # with no rollback anywhere in the system. The spec file was renamed to match.
  # One endpoint, GET /api/auth/export, and NO migration at all — no table, no
  # column, no index, so this is the first feature since F-010 that does not have
  # to route around issue #11 (still closed, still live in the code). The two
  # decisions worth reading are ADR 0026 (the export is a streamed NDJSON document
  # read in bounded keyset batches, because one unbounded SELECT plus
  # JSON.stringify against an account with no row cap is a 503 for everyone else
  # via under-pressure — and so a mid-stream failure cannot be reported, which is
  # why the last line is a terminator and why account_exports_total counts
  # `started` and `completed` separately) and ADR 0027 (the export is an allowlist:
  # every table is exported or refused BY NAME, and nothing that authenticates
  # anybody is ever exported — no password hash, no session token hash, neither
  # recovery-token table). `idempotency_keys` is refused too, and that is the
  # judgement call to push on: response_body is a 24-hour jsonb copy of the user's
  # own todos. It adds one audit action, account.exported, opening F-014's closed
  # set by the path ADR 0025 defined. No browser surface, and deliberately no web
  # backlog entry either — one account-settings screen serves both the download
  # link and F-025's delete button, so F-025's plan should own that id.
  - id: F-015
    title: Data export (GDPR access and portability)
    spec: specs/features/F-015-data-export.md
    status: done
    deps: [F-014]
    risk_tags: [pii, security, legal]

