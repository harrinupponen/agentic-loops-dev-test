  # Split during planning: "distributed" is a claim about shared state, and there
  # is no shared store — docs/deployment-sevalla.md provisions two Postgres
  # databases and nothing else. Sevalla does offer managed redis/valkey (checked,
  # not assumed), but buying two always-on instances is a human's decision, so
  # F-011 ships the Redis-backed store selected by REDIS_URL, empty in every
  # environment (ADR 0018) — the same cut F-008/F-019 made at the datasource.
  # Provisioning and enabling is F-022 at the bottom of this file. Unlike F-008,
  # the empty value is not a gap: the in-memory limiter keeps running exactly as
  # it does today, which is why no boot rule requires REDIS_URL in production.
  # The other decision worth reading is ADR 0019: an unreachable Redis degrades to
  # a per-instance count rather than failing open or closed. No migration.
  - id: F-011
    title: Distributed rate limiting backed by Redis
    spec: specs/features/F-011-distributed-rate-limit.md
    status: done
    deps: [F-003]
    risk_tags: [infra, security]

  # F-011's planning left a question here for a human: should this wait for F-022
