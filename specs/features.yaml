# Machine-readable backlog. The orchestrator reads this to pick the next feature.
# Prose lives in specs/features/F-XXX-*.md; this file is for scheduling only.
#
# status: todo | spec | spec-approved | in-progress | review | blocked | done
# Only pick up a feature whose deps are all `done` and whose status is
# `spec-approved` (implementation) or `todo` (planning).

