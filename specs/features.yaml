  # notes from F-015, none of them decisions for it: every foreign key to `users`
  # already cascades, so deletion likely needs no migration and no soft-delete
  # column; a GRACE PERIOD CANNOT BE BUILT with ADR 0017's mechanism, because that
  # sweep runs on the request path of the account that made the rows and a deleted
  # account makes no requests — deferred deletion means a scheduler, which means
  # superseding ADR 0017; the account's audit trail dies with the account, so an
  # `account.deleted` row would be destroyed by the operation it records and a
  # counter is the only durable signal; and it should require the password again,
  # for exactly the reason F-015 argued that export does not. This is the only
  # irreversible operation in the application, and a stolen session cookie plus
  # this endpoint destroys the evidence of the theft along with everything else.
